name: CD to Harbor and Civo

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment values
        id: vars
        shell: bash
        run: |
          REPOSITORY_NAME="$(basename "${{ github.repository }}")"
          VERSION="$(jq -r .version package.json)"
          TIMESTAMP="$(date +%Y%m%d%H%M%S)"

          if [ "${BRANCH_NAME}" = "main" ]; then
            ENVIRONMENT="prod"
            DEPLOYMENT_NAME="${REPOSITORY_NAME}-prod"
            K8S_NAMESPACE="${{ secrets.CIVO_K8S_NAMESPACE_PROD }}"
          else
            ENVIRONMENT="develop"
            DEPLOYMENT_NAME="${REPOSITORY_NAME}-dev"
            K8S_NAMESPACE="${{ secrets.CIVO_K8S_NAMESPACE_DEV }}"
          fi

          if [ -z "${K8S_NAMESPACE}" ]; then
            K8S_NAMESPACE="${{ secrets.CIVO_K8S_NAMESPACE }}"
          fi

          IMAGE_REPOSITORY="${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${REPOSITORY_NAME}"
          IMAGE_TAG="${ENVIRONMENT}-${VERSION}-${TIMESTAMP}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          CONTAINER_NAME="${{ secrets.CIVO_CONTAINER_NAME }}"

          if [ -z "${CONTAINER_NAME}" ]; then
            CONTAINER_NAME="${REPOSITORY_NAME}"
          fi

          echo "environment=${ENVIRONMENT}" >> "${GITHUB_OUTPUT}"
          echo "deployment_name=${DEPLOYMENT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "k8s_namespace=${K8S_NAMESPACE}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "container_name=${CONTAINER_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Build & Push Docker Image to Harbor
        shell: bash
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          VERSION=$(jq -r .version package.json)
          BUILD_IMAGE=${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ steps.vars.outputs.REPOSITORY_NAME }}-$VERSION:$TIMESTAMP
          echo "Building image: $BUILD_IMAGE"  # Debugging
          docker buildx create --use
          docker buildx build --push -t "${BUILD_IMAGE}" . --file Dockerfile.prod --platform linux/amd64
          echo "BUILD_IMAGE=$BUILD_IMAGE" >> $GITHUB_OUTPUT #export build image for later use

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig for Civo
        shell: bash
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${{ secrets.CIVO_KUBECONFIG }}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Deploy image to Civo Kubernetes
        shell: bash
        run: |
          kubectl -n "${{ steps.vars.outputs.k8s_namespace }}" set image \
            deployment/"${{ steps.vars.outputs.deployment_name }}" \
            "${{ steps.vars.outputs.container_name }}"="${{ steps.vars.outputs.image_uri }}"

      - name: Wait for rollout
        shell: bash
        run: |
          kubectl -n "${{ steps.vars.outputs.k8s_namespace }}" rollout status \
            deployment/"${{ steps.vars.outputs.deployment_name }}" \
            --timeout=300s
