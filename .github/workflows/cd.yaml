name: CD to Harbor and Civo

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment values
        id: vars
        shell: bash
        run: |
          REPOSITORY_NAME="$(basename "${{ github.repository }}")"
          VERSION="$(jq -r .version package.json)"
          TIMESTAMP="$(date +%Y%m%d%H%M%S)"

          if [ "${BRANCH_NAME}" = "main" ]; then
            ENVIRONMENT="prod"
            DEPLOYMENT_NAME="${REPOSITORY_NAME}-prod"
            K8S_NAMESPACE="${{ vars.CIVO_K8S_NAMESPACE_PROD }}"
          else
            ENVIRONMENT="develop"
            DEPLOYMENT_NAME="${REPOSITORY_NAME}-dev"
            K8S_NAMESPACE="${{ vars.CIVO_K8S_NAMESPACE_DEV }}"
          fi

          if [ -z "${K8S_NAMESPACE}" ]; then
            K8S_NAMESPACE="${{ vars.CIVO_K8S_NAMESPACE }}"
          fi

          IMAGE_REPOSITORY="${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/${DEPLOYMENT_NAME}"
          IMAGE_TAG="${ENVIRONMENT}-${VERSION}-${TIMESTAMP}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          CONTAINER_NAME="${{ vars.CIVO_CONTAINER_NAME }}"

          if [ -z "${CONTAINER_NAME}" ]; then
            CONTAINER_NAME="${REPOSITORY_NAME}"
          fi

          echo "environment=${ENVIRONMENT}" >> "${GITHUB_OUTPUT}"
          echo "deployment_name=${DEPLOYMENT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "k8s_namespace=${K8S_NAMESPACE}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "container_name=${CONTAINER_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
          
      - name: Build & Push Docker Image to Harbor
        shell: bash
        run: |
          BUILD_IMAGE="${{ steps.vars.outputs.image_uri }}"
          echo "Building image: $BUILD_IMAGE"
          echo "Branch: ${BRANCH_NAME}"
          echo "Namespace: ${{ steps.vars.outputs.k8s_namespace }}"
          echo "Deployment: ${{ steps.vars.outputs.deployment_name }}"
          echo "Container: ${{ steps.vars.outputs.container_name }}"

          docker buildx create --use
          docker buildx build --push -t "${BUILD_IMAGE}" . --file Dockerfile.prod --platform linux/amd64

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig for Civo
        shell: bash
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${{ secrets.CIVO_KUBECONFIG }}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Deploy image to Civo Kubernetes
        shell: bash
        run: |
          kubectl -n "${{ steps.vars.outputs.k8s_namespace }}" set image \
            deployment/"${{ steps.vars.outputs.deployment_name }}" \
            "${{ steps.vars.outputs.container_name }}"="${{ steps.vars.outputs.image_uri }}"

      - name: Wait for rollout
        shell: bash
        run: |
          kubectl -n "${{ steps.vars.outputs.k8s_namespace }}" rollout status \
            deployment/"${{ steps.vars.outputs.deployment_name }}" \
            --timeout=300s
